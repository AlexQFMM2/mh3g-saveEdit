name: Windows Portable Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows portable package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 5 MinGW
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-qt5

      - name: Validate generated data
        shell: pwsh
        run: python .\tools\validate_data.py .\data

      - name: Build portable package
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          .\build-windows.ps1 -QtBin "$env:MSYS2_LOCATION\mingw64\bin"

      - name: Verify SQLite portable contents
        shell: pwsh
        run: |
          if (-not (Test-Path .\release\windows\data\mh3g.sqlite)) { throw "mh3g.sqlite is missing" }
          if (-not (Test-Path .\release\windows\sqldrivers\qsqlite.dll)) { throw "qsqlite.dll is missing" }
          $csv = Get-ChildItem .\release\windows\data -Recurse -File -Filter *.csv
          if ($csv) { throw "Static game-data CSV files were packaged" }
          $resources = Get-ChildItem .\release\windows -Recurse -File | Where-Object { $_.Extension -in @('.arc','.mod','.tex','.mrl','.cci') }
          if ($resources) { throw "Game/model resources were packaged" }

      - name: Smoke test management window
        shell: pwsh
        run: |
          Push-Location .\release\windows
          .\MH3USaveEditorGUI.exe --smoke-test
          .\MH3USaveEditorGUI.exe --smoke-test-loadout
          Pop-Location

      - name: Create zip
        shell: pwsh
        run: |
          Compress-Archive `
            -Path .\release\windows\* `
            -DestinationPath .\MH3USaveEditorGUI-windows-portable.zip `
            -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MH3USaveEditorGUI-windows-portable
          path: MH3USaveEditorGUI-windows-portable.zip

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: MH3USaveEditorGUI-windows-portable.zip
